# acme/api's manifest. The team keeps it by hand.
version: 1
setup:
  - pip install -r requirements.txt
validate:
  test: python -m pytest -q   # the whole suite, on every pull request

# How a preview of this product runs (ADR-0050) — proposed by `beeverforge preview propose`;
# the pull request that added it says where each line was read.
preview:
  compose: [.beeverforge/preview.compose.yml]
  expose:
    api: 8000   # observed · Dockerfile:6

# This repository's own project manifest: how BeeverForge installs and validates the core when
# it builds the core. The annotated reference for every key is docs/project.yaml.example.
version: 1
base_branch: main

# A human merges every change to the core.
merge_policy: human
# A rejected review fails the job (bounded review-repair first, then a human) rather than
# commenting and letting the merge through (ADR-0014).
review_mode: blocking

# A VENV INSIDE THE CHECKOUT, never the environment the worker itself runs in: the worktree box
# runs these commands in the worker's own process environment, so a bare `pip install -e .` would
# re-point the running platform's editable install at a throwaway worktree. `.venv/` is gitignored.
# Python 3.12 where the machine has it, as CI runs; the dev extra and constraints.txt as
# `make install` installs them.
setup:
  - "$(command -v python3.12 || command -v python3) -m venv .venv"
  - ".venv/bin/pip install -q -U pip"
  - ".venv/bin/pip install -q -e '.[dev]' $([ -f constraints.txt ] && echo -c constraints.txt)"

validate:
  # The unit selection, as `make test-unit` cuts it. CI's own jobs (.github/workflows/ci.yml) run
  # the rest before a human merges: the tests that start their own engine or need a real Docker
  # daemon (`owns_its_engine`, `slow`) and those that assert their own CPU time (`alone`). The
  # tests that dial the network on purpose (`network`) are all `slow` as well, so they are left
  # out with them. On a box with two CPUs and a few GB, the full suite with `-n 4` did not finish
  # in 60 minutes and a worker was OOM-killed; two workers were the next step, and the notes below
  # say why the gate now runs one. One command, so its status is the gate's. 75 minutes, not the
  # 30-minute default.
  # THE TESTS THAT READ THE WHOLE TREE (`whole_tree`) ARE LEFT TO CI TOO. With them, the two
  # workers each grew to about 1.7 GB and were OOM-killed in a 3.6 GiB box, so the gate failed on
  # changes it had nothing against; each of them holds a parsed copy of the package (~260 MB a
  # worker) and together they are about a third of the unit selection's time. CI runs them before
  # a human merges.
  # ONE WORKER, AND 75 MINUTES. Without the whole-tree tests, each of the two workers still grew to
  # about 1.6 GB by the end of the selection and one was OOM-killed in the 3.6 GiB box (a box
  # proof, 2026-11-19: 2 failed, 24,701 passed in 24.5 min). One worker fits; it takes about twice
  # as long, so the bound goes from 60 to 75 minutes.
  # FOR NOW, THE TESTS IN tests/test_the_set_ends_together.py THAT RUN `ps` ARE LEFT TO CI as well:
  # they check a pid through `ps` (one also through `pgrep`), and the sandbox image of the RUNNING
  # release has no procps, so in the box they fail with `FileNotFoundError: ... 'ps'`. #567 puts
  # procps in docker/sandbox.Dockerfile, but the box runs the published image of the release
  # already deployed. Remove these `--deselect`s once that release's sandbox image carries procps.
  test:
    timeout_minutes: 75
    command: >-
      .venv/bin/python -m pytest -q -n 1 -m "not (owns_its_engine or slow or alone or whole_tree)"
      --deselect tests/test_the_set_ends_together.py::test_a_supervisor_asked_to_stop_by_a_signal_stops_the_set
      --deselect tests/test_the_set_ends_together.py::test_a_supervisor_KILLED_outright_still_takes_its_children_with_it
      --deselect tests/test_the_set_ends_together.py::test_a_child_that_ignores_the_request_to_stop_is_made_to
      --deselect tests/test_the_set_ends_together.py::test_one_child_dying_still_ends_the_set
      --deselect tests/test_the_set_ends_together.py::test_an_orderly_stop_leaves_no_reaper_behind
  lint: ".venv/bin/ruff check beeverforge/ tests/"
  # ADVISORY: mypy is configured in pyproject.toml but CI does not gate on it yet, and the tree
  # does not type-check clean, so a blocking gate would fail every change.
  type:
    command: ".venv/bin/mypy beeverforge"
    advisory: true
  security:
    command: ".venv/bin/bandit -r beeverforge -ll -q"
    advisory: true
    timeout_minutes: 20

# THE ADRs ARE INDEXED (path + title each), NOT INLINED. `docs.constraints` inlines every file it
# matches, and the prompt travels as a single argv token, so this repository's ADRs together pass
# Linux's 128 KiB single-argument ceiling (#326). The agent opens the ADRs it needs from the
# checkout. Move them to `constraints:` once the prompt no longer travels in the argv.
docs:
  architecture: docs/adr/**

# Repo-wide gates: the core is one Python package.
components: {}

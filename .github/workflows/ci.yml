# CI for the platform itself (O3) — the platform that enforces gates on other repos
# must gate its own code. deploy.sh also refuses to ship a red tree.
#
# THE SUITE RUNS AS JOBS SIDE BY SIDE: lint, the tests that start their own durable engine or need
# Docker, and the rest in slices. One job running everything took 22–26 minutes on every pull
# request. The jobs are cut by marker and by a slice of the node id (`make test-unit`,
# `make test-integration`), never by a list, so a test added tomorrow lands in one of them; and the
# job named `test` — the check reviewers and the rulesets know — proves every collected test ran
# exactly once before it says green.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # `make install`: the core with its dev tools (the `dev` extra carries the runtime's
      # dependencies — the suite covers the durable runtime), plus every add-on package under
      # addons/ where the tree has one. The public tree has none, and the same line installs
      # the core alone there.
      - run: make install
      # `make lint`: THE line the gate runs (`tests/test_ci_runs_what_we_run.py` derives the roots
      # the suite covers and holds this to them). It ran `ruff check beeverforge/ tests/` here
      # while the gate covered addons/ too — the add-on packages were never linted by CI.
      - run: make lint
      # the whole collection, which the `test` job holds the other jobs' runs to
      - run: make test-collect
        env:
          TEST_IDS: ${{ runner.temp }}/beeverforge-test-ids/collected.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-ids-collected
          path: ${{ runner.temp }}/beeverforge-test-ids/

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make install
      - run: make test-unit
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARDS: 4
          TEST_IDS: ${{ runner.temp }}/beeverforge-test-ids/ran-unit-${{ matrix.shard }}.txt
          # THE COVERAGE FLOOR IS MEASURED HERE, ON PUSHES TO MAIN ONLY (#334). Measuring costs the
          # unit tests 1.4x to 1.9x their wall clock (the Makefile has the runs), so a pull request
          # keeps today's speed; a push to main is the merge itself, so the floor is held right
          # after each one, and a red there names the merge that lowered it. `make coverage` runs
          # the same before a merge. In these slices, because a job of its own would run the whole
          # selection a second time to learn what these four already executed. Each slice writes
          # one data file and is held to nothing; the job named `test` holds the four combined.
          # Empty on a pull request: the Makefile reads an empty TEST_COVERAGE as unset.
          TEST_COVERAGE: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ids-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/beeverforge-test-ids/
      # ON A PUSH, AND ON SUCCESS ONLY (an `if` without a status function implies success()): a
      # slice that failed is already red, and its partial data would only add a second, misleading
      # red below the floor. `error` when a passing slice wrote nothing, or the floor would be held
      # over three slices' data as if it were four.
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'pull_request')
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/beeverforge-coverage/
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make install
      - run: make test-integration
        env:
          TEST_IDS: ${{ runner.temp }}/beeverforge-test-ids/ran-integration.txt
          # docker is here: a live preview test fails rather than skips where the daemon does not
          # answer or S1 cannot be built (a lost registry, a pull limit) — red, not silent (#358).
          # So does the Codex tables guard: it builds the worker image's toolbox stage and reads
          # that codex's own help; in the unit shards it had no codex and skipped every run (#805)
          TEST_REQUIRE_DOCKER: "1"
      # after the parallel run, in a process of its own: these assert their own CPU time
      - run: make test-alone
        env:
          TEST_IDS: ${{ runner.temp }}/beeverforge-test-ids/ran-alone.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ids-integration
          path: ${{ runner.temp }}/beeverforge-test-ids/

  test:
    needs: [lint, unit, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "lint: ${{ needs.lint.result }}, unit: ${{ needs.unit.result }}, integration: ${{ needs.integration.result }}"
          exit 1
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: test-ids-*
          path: ${{ runner.temp }}/beeverforge-test-ids
          merge-multiple: true
      - if: always()
        run: make test-ran-once
      # THE FLOOR (#334), ON PUSHES TO MAIN ONLY, as the unit job says why: the four unit slices'
      # data, combined, against `fail_under` in pyproject.toml. Only coverage.py is needed to read
      # it, not the suite's dependencies, at the floor pytest-cov 7.1 itself requires. Skipped
      # when a slice failed: that job's own red already names the failure.
      - if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.unit.result == 'success'
        run: pip install 'coverage>=7.10.6'
      - uses: actions/download-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.unit.result == 'success'
        with:
          pattern: coverage-unit-*
          path: ${{ runner.temp }}/beeverforge-coverage
          merge-multiple: true
      - if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.unit.result == 'success'
        run: make coverage-report
